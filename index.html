<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Avaliação de Desempenho Raguife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Identidade visual Raguife — mesma base dos sistemas de Indicadores e Calibração */
:root{
  --verde:#024f2b; --verde-esc:#01361d; --verde-2:#036c3b; --lima:#9dcd46; --lima-cl:#cfe6a8; --lima-bg:#e7f2d2;
  --oliva:#739630; --oliva-esc:#5c7a22;
  --ink:#15201a; --muted:#5d6a62; --line:#dde5de; --line2:#eef3ef; --mist:#f2f5f0; --paper:#fff; --hover:#f7faf6;
  --bad:#b3372f; --badSoft:#fbecea; --warn:#9a6a08; --warnSoft:#fdf3dc; --okc:#1f7a45; --okSoft:#e3f2e7;
  --info:#1d4e89; --infoSoft:#e6eef8;
  --tex:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 2px,transparent 2px,transparent 14px);
  --font:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:'Archivo',Poppins,system-ui,sans-serif;
  --mod:#7aa53a; --mod-esc:#5c7a22; --mod-soft:#eaf3dc;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--mist);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
h1,h2,h3{font-family:var(--font);margin:0;}
button,input,select,textarea{font-family:inherit;}
a{color:var(--verde);}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.hidden{display:none!important;}

.eyebrow-mod{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--mod-esc);}
.eyebrow-mod:before{content:"";width:22px;height:3px;background:var(--mod);flex:none;}

/* ===== demo ===== */
.demo-bar{background:var(--warnSoft);color:#6d4b06;border-bottom:1px solid #ecd9a6;padding:8px 16px;font-size:12.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.demo-bar b{font-weight:700;}
.demo-bar button{margin-left:auto;background:transparent;border:1px solid #c9a95a;color:#6d4b06;font-weight:600;font-size:12px;padding:5px 10px;cursor:pointer;}

/* ===== login / tela cheia ===== */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);}
.auth-art{background:var(--verde-esc);background-image:var(--tex);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.auth-art:after{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(157,205,70,.14);}
.auth-art:before{content:"";position:absolute;left:30%;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(157,205,70,.08);}
.auth-art > *{position:relative;z-index:1;}
.auth-brand{display:flex;align-items:center;gap:12px;}
.wordmark{font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1;display:block;}
.app-sub{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lima);display:block;margin-top:4px;}
.auth-title{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:64px;line-height:.92;text-transform:uppercase;margin:0;}
.auth-title em{font-style:normal;color:var(--lima);}
.auth-art p{color:#cfe0d4;max-width:46ch;font-size:14px;line-height:1.6;}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--paper);}
.auth-box{width:100%;max-width:360px;}
.auth-box h2{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:34px;color:var(--verde);text-transform:uppercase;margin:6px 0 18px;line-height:1;}
.auth-box .fld{margin-bottom:14px;}
.auth-msg{font-size:12.5px;color:var(--bad);min-height:18px;margin-top:10px;}
.auth-help{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.55;}
@media (max-width:860px){.auth-wrap{grid-template-columns:1fr}.auth-art{padding:28px 20px}.auth-title{font-size:42px}}

/* ===== app shell ===== */
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;}
aside.side{background:var(--verde-esc);background-image:var(--tex);color:#fff;padding:20px 16px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 4px 16px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);}
.side .navs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-top:12px;scrollbar-width:none;}
.navlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#8fb39a;padding:2px 12px 6px;}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;color:#d3e2d8;padding:9px 12px;font-size:13.5px;cursor:pointer;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;border-left-color:var(--lima);}
.navbtn .ic{width:20px;height:20px;display:grid;place-items:center;color:#9fbfa9;flex:none;}
.navbtn .ic svg{width:19px;height:19px;}
.navbtn.active .ic,.navbtn:hover .ic{color:var(--lima);}
.navbtn .cnt{margin-left:auto;background:var(--lima);color:var(--verde-esc);font-size:10.5px;font-weight:800;padding:1px 7px;}
.side .who{border-top:1px solid rgba(255,255,255,.14);padding-top:14px;margin-top:10px;}
.who-id{display:flex;align-items:center;gap:10px;padding:0 4px 10px;}
.who-av{width:36px;height:36px;background:var(--lima);color:var(--verde-esc);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;}
.who-tx{min-width:0;}
.who-tx b{display:block;font-size:12.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who-tx span{display:block;font-size:11px;color:#a9c4b1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who-btns{display:flex;gap:6px;}
.btn-top{flex:1;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 8px;font-weight:600;font-size:12px;cursor:pointer;}
.btn-top:hover{background:rgba(255,255,255,.08);}
main{padding:30px 36px 80px;min-width:0;}
.page{max-width:1180px;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);}
  aside.side{position:sticky;height:auto;padding:12px 14px;min-width:0;}
  .side .brand{border-bottom:0;padding:0 4px 4px;margin:0;}
  .side .navs{flex-direction:row;gap:14px;overflow-x:auto;padding:6px 2px;}
  .side .navs .grp{display:flex;gap:4px;}
  .navlbl{display:none;}
  .navbtn{width:auto;white-space:nowrap;padding:8px 12px;border-left:0;border-bottom:3px solid transparent;}
  .navbtn.active{border-bottom-color:var(--lima);}
  .side .who{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:0;padding-top:6px;margin-top:0;}
  .who-id{padding:0;}
  .btn-top{flex:none;padding:7px 12px;}
  main{padding:20px 16px 60px;}
}

/* ===== cabeçalhos ===== */
.page-head{margin-bottom:22px;}
.page-title{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:40px;line-height:.95;color:var(--verde);text-transform:uppercase;letter-spacing:.005em;margin:8px 0 0;}
.page-desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:10px 0 0;max-width:80ch;}
.hero{position:relative;overflow:hidden;background:var(--verde);background-image:var(--tex);color:#fff;padding:26px 30px 28px;margin:0 0 24px;border-bottom:6px solid var(--mod);}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(157,205,70,.16);}
.hero:before{content:"";position:absolute;right:120px;bottom:-90px;width:150px;height:150px;border-radius:50%;background:rgba(157,205,70,.10);}
.hero > *{position:relative;z-index:1;}
.hero .eyebrow-mod{color:var(--lima-cl);} .hero .eyebrow-mod:before{background:var(--lima);}
.hero .page-title{color:#fff;font-size:52px;}
.hero .page-title em{font-style:normal;color:var(--lima);}
.hero .page-desc{color:#d9e6dc;}
@media (max-width:900px){.hero{padding:22px 18px}.hero .page-title{font-size:38px}.page-title{font-size:32px}}

/* ===== blocos ===== */
.panel{background:var(--paper);border:1px solid var(--line);padding:20px 22px 22px;margin-bottom:20px;}
.panel h2{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--verde);font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:0 0 4px;}
.panel h2:before{content:"";width:18px;height:3px;background:var(--mod);flex:none;}
.panel .desc{color:var(--muted);font-size:12.5px;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line2);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.kpi{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--verde);padding:16px 18px;position:relative;}
.kpi:nth-child(even){border-top-color:var(--mod);}
.kpi .eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;}
.kpi .val{font-family:var(--display);font-stretch:75%;font-size:40px;line-height:1;font-weight:900;color:var(--verde);font-variant-numeric:tabular-nums;}
.kpi .meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.kpi .bar{margin-top:12px;height:5px;background:var(--line2);overflow:hidden;}
.kpi .bar span{display:block;height:100%;background:var(--mod);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;}
.grid2 > .panel{margin-bottom:0;}

.pill{font-size:10px;font-weight:700;padding:3px 8px;letter-spacing:.06em;text-transform:uppercase;display:inline-block;white-space:nowrap;}
.p-ok{background:var(--okSoft);color:var(--okc);}
.p-bad{background:var(--badSoft);color:var(--bad);}
.p-warn{background:var(--warnSoft);color:var(--warn);}
.p-info{background:var(--infoSoft);color:var(--info);}
.p-neutral{background:#eef1ee;color:var(--muted);}
.p-verde{background:var(--verde);color:#fff;}

label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #c9d5cc;border-radius:0;font-size:14px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px rgba(2,79,43,.12);}
input:disabled,select:disabled,textarea:disabled{background:#eef1ee;color:var(--muted);}
input[type=file]{padding:9px;}
input[type=file]::file-selector-button{border:0;background:var(--lima-bg);color:var(--verde);font-weight:700;padding:7px 12px;margin-right:10px;cursor:pointer;font-family:inherit;}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--verde);}
textarea{resize:vertical;min-height:70px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.fld{min-width:0;}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

.btn{font-weight:700;font-size:13.5px;border:none;border-radius:0;padding:11px 20px;min-height:44px;cursor:pointer;transition:background .15s;line-height:1.2;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--verde);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--verde-2);}
.btn-leaf{background:var(--lima);color:var(--verde-esc);}
.btn-leaf:hover:not(:disabled){background:#8dbd3a;}
.btn-ghost{background:#fff;color:var(--verde);border:1px solid #c9d5cc;}
.btn-ghost:hover:not(:disabled){background:var(--hover);border-color:var(--verde);}
.btn-danger{background:var(--badSoft);color:#9b2c24;}
.btn-danger:hover:not(:disabled){background:#f6dcd9;}
.btn-mini{padding:6px 11px;min-height:32px;font-size:11.5px;}
.btn-row{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn-link{background:none;border:0;color:var(--verde);font-weight:700;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--hover);white-space:nowrap;position:sticky;top:0;z-index:1;}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--hover);}
tr.click{cursor:pointer;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td .sub{display:block;font-size:11.5px;color:var(--muted);}
.table-wrap{overflow:auto;border:1px solid var(--line2);max-height:620px;}
.empty{color:var(--muted);font-size:13px;padding:28px 12px;text-align:center;}
td input,td select{padding:7px 9px;font-size:13px;}

.filter-bar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--mod);padding:14px 16px;}
.filter-bar .fld{min-width:150px;flex:1;}
.filter-bar .fld.grow{flex:3;}
.count{font-size:12px;color:var(--muted);margin:6px 0;}
.note{font-size:12.5px;color:var(--ink);background:var(--lima-bg);border-left:4px solid var(--oliva);padding:11px 14px;margin:12px 0;line-height:1.55;}
.note.warn{background:var(--warnSoft);border-left-color:#c3901f;color:#5e4207;}
.note.bad{background:var(--badSoft);border-left-color:var(--bad);color:#7a231d;}

/* abas */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab{background:none;border:0;padding:11px 18px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.on{color:var(--verde);border-bottom-color:var(--lima);}

/* etapas do ciclo */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 4px;}
.step{background:var(--mist);border:1px solid var(--line);padding:12px 12px 10px;position:relative;}
.step .n{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:24px;color:#b4c3b9;line-height:1;}
.step .t{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
.step .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
.step.done{background:var(--lima-bg);border-color:var(--lima-cl);}
.step.done .n{color:var(--oliva);}
.step.cur{background:var(--verde);border-color:var(--verde);}
.step.cur .n{color:var(--lima);} .step.cur .t{color:#fff;} .step.cur .d{color:#cfe0d4;}
@media (max-width:760px){.stepper{grid-template-columns:1fr 1fr}}

/* barras */
.hbar{display:flex;height:26px;overflow:hidden;border:1px solid var(--line);}
.hbar span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;}
.minibar{display:inline-block;width:90px;height:6px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden;}
.minibar span{display:block;height:100%;background:var(--mod);}

/* 9-box */
.ninebox{display:grid;grid-template-columns:34px repeat(3,1fr);grid-template-rows:repeat(3,minmax(104px,auto)) 30px;gap:6px;}
.nb-axis-y{grid-row:1/4;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.nb-axis-x{grid-column:2/5;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.nb-cell{border:1px solid var(--line);padding:10px 12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.12s;}
.nb-cell:hover{border-color:var(--verde);}
.nb-cell.sel{outline:3px solid var(--lima);outline-offset:-3px;}
.nb-cell .nb-n{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:32px;line-height:1;}
.nb-cell .nb-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.nb-cell .nb-p{font-size:11px;color:var(--muted);}
.nb-cell .nb-ax{font-size:10px;color:var(--muted);margin-top:auto;}

/* avaliação */
.av-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.av-progress{flex:1;min-width:200px;}
.av-progress .bar{height:8px;background:var(--line2);overflow:hidden;}
.av-progress .bar span{display:block;height:100%;background:var(--lima);transition:width .2s;}
.comp-card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--verde);padding:18px 20px;margin-bottom:14px;}
.comp-card.comp{border-left-color:var(--mod);}
.comp-card h3{font-size:16px;color:var(--verde);font-weight:700;margin:2px 0 12px;}
.comp-card .eixo{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.opts{display:grid;gap:8px;}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid #d5dfd8;padding:11px 14px;cursor:pointer;background:#fff;transition:.12s;font-size:13.5px;line-height:1.5;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);margin:0;}
.opt:hover{border-color:var(--verde);background:var(--hover);}
.opt input{margin-top:3px;flex:none;}
.opt.on{border-color:var(--verde);background:var(--lima-bg);box-shadow:inset 4px 0 0 var(--verde);}
.av-foot{position:sticky;bottom:0;background:rgba(242,245,240,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5;}
.person-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);padding:12px 16px;margin-bottom:8px;}
.person-card .pc-tx{flex:1;min-width:0;}
.person-card b{display:block;font-size:14px;}
.person-card span{font-size:12px;color:var(--muted);}
.grp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 0 8px;}

/* modal / toast */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(1,20,10,.55);z-index:80;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
#modal-bg.open{display:flex;}
.modal{background:#fff;padding:0 24px 22px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.34);}
.modal.wide{max-width:900px;}
.modal h3{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#fff;background:var(--verde);background-image:var(--tex);margin:0 -24px 18px;padding:16px 24px;border-bottom:4px solid var(--mod);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;font-size:13px;font-weight:700;z-index:90;opacity:0;transition:all .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--bad);}
.loading{padding:40px;text-align:center;color:var(--muted);}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== carta ===== */
.carta-wrap{background:#e9eee9;padding:20px;overflow:auto;}
.rg-carta{font-family:"Segoe UI",Arial,sans-serif;font-size:13px;color:#222;background:#fff;max-width:820px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.08);}
.rg-head{display:flex;align-items:center;justify-content:space-between;background:#0d3b1c;padding:14px 24px;}
.rg-head img{height:34px;}
.rg-head-r{text-align:right;color:#fff;}
.rg-head-r b{display:block;font-size:13px;}
.rg-head-r span{font-size:9.5px;color:rgba(255,255,255,.6);letter-spacing:.3px;}
.rg-colab{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:18px 24px;color:#fff;}
.rg-nome{font-size:22px;font-weight:900;line-height:1.1;}
.rg-cargo{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px;}
.rg-badge{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;padding:4px 12px;background:rgba(255,255,255,.18);}
.rg-badge small{display:block;font-weight:400;font-size:10px;opacity:.8;}
.rg-medias{display:flex;background:rgba(0,0,0,.18);}
.rg-media{display:flex;flex-direction:column;align-items:center;padding:9px 16px;}
.rg-media b{font-size:22px;font-weight:900;line-height:1;}
.rg-media span{font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-top:3px;}
.rg-sec{padding:12px 24px;}
.rg-sec-t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#134F22;border-bottom:2px solid #e2ebe4;padding-bottom:5px;margin-bottom:9px;}
.rg-txt{line-height:1.75;}
.rg-txt p{margin:0 0 8px;}
.rg-txt strong{color:#134F22;}
.rg-destaque{margin:4px 24px;padding:9px 14px;background:#f1f8f2;border-left:4px solid #7DC242;font-style:italic;color:#134F22;}
.rg-passos{margin:0 0 0 18px;padding:0;}
.rg-passos li{margin-bottom:5px;line-height:1.6;}
.rg-comp{display:flex;align-items:center;gap:9px;padding:6px 10px;border:1px solid #e8ede9;margin-bottom:5px;}
.rg-comp .t{font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 7px;}
.rg-comp .n{flex:1;}
.rg-comp .v{font-weight:800;padding:2px 9px;}
.rg-pdi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.rg-pdi-c{border:1px solid #e8ede9;border-top:3px solid #14532D;}
.rg-pdi-h{padding:8px 10px;font-size:12px;font-weight:700;}
.rg-pdi-h b{font-size:15px;margin-right:6px;}
.rg-pdi-c ul{margin:0;padding:0 10px 8px;list-style:none;}
.rg-pdi-c li{font-size:11.5px;line-height:1.55;padding:6px 0;border-bottom:1px dashed #e3e9e4;}
.rg-pdi-c li:last-child{border-bottom:0;}
.rg-pdi-c li i{display:block;font-style:normal;font-size:9px;font-weight:700;text-transform:uppercase;color:#587060;margin-bottom:2px;}
.rg-comb{min-height:70px;border:1.5px dashed #A8D5B0;padding:10px 12px;line-height:1.6;white-space:pre-wrap;}
.rg-ass{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:34px 24px 26px;}
.rg-ass div{border-top:1px solid #999;padding-top:6px;font-size:11px;color:#555;text-align:center;}
@media (max-width:700px){.rg-pdi{grid-template-columns:1fr}.rg-colab{grid-template-columns:1fr}}

@media print{
  body{background:#fff;}
  body.printing > *:not(#print-area){display:none!important;}
  #print-area{display:block!important;}
  #print-area .rg-carta{box-shadow:none;max-width:none;page-break-after:always;}
  @page{size:A4;margin:10mm;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
#print-area{display:none;}

<script>
/* js/store.js */
/* ============================================================
   CAMADA DE DADOS
   Mesma interface para o Firebase (produção) e para o modo
   demonstração (localStorage). O resto do sistema só usa DB e AUTH.
   ============================================================ */
(function () {
  const FB_VER = "10.12.0";
  const cfg = window.FIREBASE_CONFIG || {};
  const MODO = cfg.apiKey && cfg.projectId ? "firebase" : "demo";
  window.MODO_DADOS = MODO;

  function loadScript(src) {
    return new Promise((ok, err) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => err(new Error("Falha ao carregar " + src));
      document.head.appendChild(s);
    });
  }
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------------- FIREBASE ---------------- */
  async function initFirebase() {
    const base = `https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`;
    await loadScript(base + "firebase-app-compat.js");
    await loadScript(base + "firebase-auth-compat.js");
    await loadScript(base + "firebase-firestore-compat.js");
    const app = firebase.initializeApp(cfg);
    const fs = app.firestore();
    const auth = app.auth();
    let sec = null; // app secundário: cria contas sem derrubar a sessão do RH

    const DB = {
      async get(col, id) {
        const d = await fs.collection(col).doc(id).get();
        return d.exists ? { id: d.id, ...d.data() } : null;
      },
      async list(col, where = []) {
        let q = fs.collection(col);
        where.forEach(([f, op, v]) => (q = q.where(f, op, v)));
        const s = await q.get();
        return s.docs.map((d) => ({ id: d.id, ...d.data() }));
      },
      async set(col, id, data, merge = false) {
        await fs.collection(col).doc(id).set(data, { merge });
      },
      async update(col, id, data) {
        await fs.collection(col).doc(id).update(data);
      },
      async add(col, data) {
        const r = await fs.collection(col).add(data);
        return r.id;
      },
      async del(col, id) {
        await fs.collection(col).doc(id).delete();
      },
      /* ops: [{op:'set'|'update'|'delete', col, id, data, merge}] — em lotes de 400 */
      async batch(ops, onProg) {
        for (let i = 0; i < ops.length; i += 400) {
          const b = fs.batch();
          ops.slice(i, i + 400).forEach((o) => {
            const ref = fs.collection(o.col).doc(o.id);
            if (o.op === "delete") b.delete(ref);
            else if (o.op === "update") b.update(ref, o.data);
            else b.set(ref, o.data, { merge: !!o.merge });
          });
          await b.commit();
          onProg && onProg(Math.min(i + 400, ops.length), ops.length);
        }
      },
    };

    const AUTH = {
      onChange(cb) { auth.onAuthStateChanged((u) => cb(u ? { uid: u.uid } : null)); },
      async login(email, senha) { await auth.signInWithEmailAndPassword(email, senha); },
      async logout() { await auth.signOut(); },
      async changePassword(nova) { await auth.currentUser.updatePassword(nova); },
      async createUser(email, senha) {
        if (!sec) sec = firebase.initializeApp(cfg, "secundario");
        const r = await sec.auth().createUserWithEmailAndPassword(email, senha);
        const uid = r.user.uid;
        await sec.auth().signOut();
        return uid;
      },
      /* conta do próprio usuário (setup inicial) */
      async createSelf(email, senha) {
        const r = await auth.createUserWithEmailAndPassword(email, senha);
        return r.user.uid;
      },
      currentUid() { return auth.currentUser ? auth.currentUser.uid : null; },
    };
    return { DB, AUTH };
  }

  /* ---------------- DEMONSTRAÇÃO (localStorage) ---------------- */
  function initDemo() {
    const KEY = "avaliacao_raguife_demo_v1";
    const SKEY = "avaliacao_raguife_demo_sessao";
    let mem;
    try { mem = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { mem = null; }
    if (!mem) mem = { cols: {}, users: {} };
    let pend = null;
    const flush = () => { pend = null; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* sem storage: fica em memória */ } };
    const save = () => { if (!pend) pend = setTimeout(flush, 80); };
    window.addEventListener("beforeunload", () => pend && (clearTimeout(pend), flush()));
    const col = (c) => (mem.cols[c] = mem.cols[c] || {});
    let seq = Date.now();
    const newId = () => "d" + (seq++).toString(36);
    const tick = () => new Promise((r) => setTimeout(r, 0));
    const match = (d, [f, op, v]) => {
      const x = d[f];
      if (op === "==") return x === v;
      if (op === "!=") return x !== v;
      if (op === "in") return v.includes(x);
      if (op === "array-contains") return Array.isArray(x) && x.includes(v);
      if (op === ">=") return x >= v;
      if (op === "<=") return x <= v;
      return true;
    };
    const merge = (a, b) => Object.assign({}, a || {}, b);

    const DB = {
      async get(c, id) { await tick(); const d = col(c)[id]; return d ? { id, ...clone(d) } : null; },
      async list(c, where = []) {
        await tick();
        return Object.entries(col(c)).filter(([, d]) => where.every((w) => match(d, w))).map(([id, d]) => ({ id, ...clone(d) }));
      },
      async set(c, id, data, m = false) { col(c)[id] = m ? merge(col(c)[id], clone(data)) : clone(data); save(); },
      async update(c, id, data) {
        if (!col(c)[id]) throw new Error("Documento não encontrado: " + c + "/" + id);
        col(c)[id] = merge(col(c)[id], clone(data)); save();
      },
      async add(c, data) { const id = newId(); col(c)[id] = clone(data); save(); return id; },
      async del(c, id) { delete col(c)[id]; save(); },
      async batch(ops, onProg) {
        ops.forEach((o) => {
          if (o.op === "delete") delete col(o.col)[o.id];
          else if (o.op === "update") col(o.col)[o.id] = merge(col(o.col)[o.id], clone(o.data));
          else col(o.col)[o.id] = o.merge ? merge(col(o.col)[o.id], clone(o.data)) : clone(o.data);
        });
        save(); onProg && onProg(ops.length, ops.length); await tick();
      },
    };

    let listener = null;
    let sess = null;
    try { sess = sessionStorage.getItem(SKEY); } catch (e) { sess = null; }
    const fire = () => listener && listener(sess ? { uid: sess } : null);
    const setSess = (uid) => { sess = uid; try { uid ? sessionStorage.setItem(SKEY, uid) : sessionStorage.removeItem(SKEY); } catch (e) {} fire(); };
    const err = (code) => { const e = new Error(code); e.code = code; return e; };

    const AUTH = {
      onChange(cb) { listener = cb; setTimeout(fire, 0); },
      async login(email, senha) {
        await tick();
        const u = mem.users[email];
        if (!u || u.senha !== senha) throw err("auth/invalid-credential");
        setSess(u.uid);
      },
      async logout() { setSess(null); },
      async changePassword(nova) {
        const e = Object.keys(mem.users).find((k) => mem.users[k].uid === sess);
        if (e) { mem.users[e].senha = nova; save(); }
      },
      async createUser(email, senha) {
        if (mem.users[email]) throw err("auth/email-already-in-use");
        const uid = "u" + newId();
        mem.users[email] = { uid, senha }; save();
        return uid;
      },
      async createSelf(email, senha) { const uid = await AUTH.createUser(email, senha); setSess(uid); return uid; },
      currentUid() { return sess; },
      /* só no modo demonstração */
      resetDemo() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(SKEY); } catch (e) {} location.reload(); },
    };
    return Promise.resolve({ DB, AUTH });
  }

  window.initStore = async function () {
    const r = MODO === "firebase" ? await initFirebase() : await initDemo();
    window.DB = r.DB;
    window.AUTH = r.AUTH;
    return MODO;
  };
})();

async function ir(p, params) {
  const item = NAV.flatMap((g) => g.itens).find((i) => i.id === p);
  if (!item || !item.ver()) p = "inicio";
  S.page = p; S.params = params || {};
  $$(".navbtn").forEach((b) => b.classList.toggle("active", b.dataset.p === p));
  const main = $("#main");
  main.innerHTML = `<div class="loading"><span class="spin"></span> Carregando…</div>`;
  window.scrollTo(0, 0);
  try { await PAGES[p](main, S.params); } catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="note bad">Não foi possível abrir esta tela: ${esc(erroAmigavel(e))}</div></div>`; }
}
async function atualizarContadorMinhas() {
  if (!S.ciclo || S.ciclo.etapa !== "avaliacao") return;

    const l = await DB.list("avaliacoes", [["avaliador", "==", S.me.matricula], ["ciclo", "==", S.ciclo.id]]);
    const n = l.filter((a) => a.status !== "enviada").length;
    const el = $("#cnt-minhas"); if (el) { el.textContent = n; el.classList.toggle("hidden", !n); }

}
const cabecalho = (eyebrow, tit, desc) => `<div class="page-head"><div class="eyebrow-mod">${esc(eyebrow)}</div><h1 class="page-title">${tit}</h1>${desc ? `<p class="page-desc">${desc}</p>` : ""}</div>`;
const semCiclo = () => `<div class="panel"><h2>Nenhum ciclo aberto</h2><p class="desc" style="border:0;margin:0;padding:0">${ehRH() ? `Abra um ciclo em <button class="btn-link" onclick="ir('ciclos')">Ciclo</button> para começar.` : "O RH ainda não abriu o ciclo de avaliação."}</p></div>`;
function kpi(rot, val, meta, barPct) {
  return `<div class="kpi"><div class="eyebrow">${rot}</div><div class="val">${val}</div>${meta ? `<div class="meta">${meta}</div>` : ""}${barPct != null ? `<div class="bar"><span style="width:${Math.min(100, barPct)}%"></span></div>` : ""}</div>`;
}
function stepperHTML(etapa) {
  const i = ETAPAS.findIndex((e) => e.id === etapa);
  return `<div class="stepper">${ETAPAS.map((e, k) => `<div class="step ${k < i ? "done" : k === i ? "cur" : ""}"><div class="n">${k + 1}</div><div class="t">${e.t}</div><div class="d">${e.d}</div></div>`).join("")}</div>`;
}

      ${["ciclos", "funcionarios", "ocorrencias", "elegibilidade", "avaliadores", "acessos", "acompanhamento", "resultados"].map((p) => `<button class="btn btn-ghost btn-mini" onclick="ir('${p}')">${NAV.flatMap((g) => g.itens).find((i) => i.id === p).t}</button>`).join("")}</div></div>`;

  html += `</div>`;

};

function telaAuth(conteudo) {
  $("#root").innerHTML = `<div class="auth-wrap">
    <div class="auth-art">

function telaLogin(msg) {
  telaAuth(`<div class="eyebrow-mod">Acesso</div><h2>Entrar</h2>
    <form id="f-login" autocomplete="on">
      <div class="fld"><label for="l-mat">Matrícula ou CPF</label><input id="l-mat" inputmode="numeric" autocomplete="username" required placeholder="Matrícula (0200802) ou CPF, só números"></div>

}
function telaTrocaSenha(voluntaria) {
  const html = `<div class="eyebrow-mod">${voluntaria ? "Sua conta" : "Primeiro acesso"}</div><h2>${voluntaria ? "Alterar senha" : "Crie sua senha"}</h2>
    <form id="f-senha">
      <div class="fld"><label>Nova senha</label><input type="password" id="s1" minlength="6" required autocomplete="new-password"></div>
      <div class="fld"><label>Repita a nova senha</label><input type="password" id="s2" minlength="6" required autocomplete="new-password"></div>
      <button class="btn btn-primary" style="width:100%" type="submit">Salvar senha</button>
      ${voluntaria ? `<button class="btn btn-ghost" style="width:100%;margin-top:8px" type="button" id="s-cancel">Cancelar</button>` : ""}
      <div class="auth-msg" id="s-msg"></div>
    </form><p class="auth-help">Use ao menos 6 caracteres. Não compartilhe sua senha: suas avaliações são confidenciais.</p>`;
  if (voluntaria) { const m = modal(`<h3>Alterar senha</h3>` + html.replace(/<div class="eyebrow-mod">.*?<\/h2>/s, "")); $("#s-cancel", m).onclick = fecharModal; }
  else telaAuth(html);
  $("#f-senha").onsubmit = async (e) => {
    e.preventDefault();
    const a = $("#s1").value, b = $("#s2").value, msgEl = $("#s-msg");
    if (a !== b) { msgEl.textContent = "As senhas não conferem."; return; }
    if (a.length < 6) { msgEl.textContent = "Use ao menos 6 caracteres."; return; }
    await comBotao($("#f-senha button[type=submit]"), async () => {
      try {
        await AUTH.changePassword(a);
        if (S.me.trocarSenha) { await DB.update("usuarios", S.me.uid, { trocarSenha: false }); S.me.trocarSenha = false; }
        if (voluntaria) { fecharModal(); toast("Senha alterada."); } else { await entrarNoApp(); }
      } catch (er) { msgEl.textContent = erroAmigavel(er); }
    });
  };
}
function telaSetup() {
  telaAuth(`<div class="eyebrow-mod">Primeira configuração</div><h2>Criar acesso do RH</h2>
    <p class="auth-help" style="margin:-6px 0 14px">Este sistema ainda não tem usuários. Cadastre o primeiro responsável do RH; os demais acessos são gerados depois, dentro do sistema.</p>

      <div class="fld"><label>Matrícula</label><input id="u-mat" required inputmode="numeric"></div>
      <div class="fld"><label>Nome completo</label><input id="u-nome" required></div>

      <div class="fld"><label>Repita a senha</label><input id="u-s2" type="password" minlength="6" required></div>
      <button class="btn btn-primary" style="width:100%" type="submit">Criar e entrar</button>
      <div class="auth-msg" id="u-msg"></div>
    </form>`);
  $("#f-setup").onsubmit = async (e) => {
    e.preventDefault();
    const mat = padMat($("#u-mat").value), nome = $("#u-nome").value.trim().toUpperCase(), s1 = $("#u-s1").value;
    if (!mat) return ($("#u-msg").textContent = "Informe a matrícula.");
    if (s1 !== $("#u-s2").value) return ($("#u-msg").textContent = "As senhas não conferem.");
    await comBotao($("#f-setup button"), async () => {
      S.boot = true;
      try {
        const email = emailDe(mat, 0);
        const uid = await AUTH.createSelf(email, s1);
        await DB.batch([
          { col: "usuarios", id: uid, data: { matricula: mat, nome, perfis: ["rh"], trocarSenha: false, versao: 0, criadoEm: agoraISO() } },
          { col: "logins", id: mat, data: { email, uid } },
          { col: "config", id: "geral", data: { criadoEm: agoraISO(), cicloAtivo: null } },
        ]);
        await DB.batch([
          ...Object.keys(PUBLICOS).map((p) => ({ col: "questionarios", id: p, data: { publico: p, competencias: window.MATRIZ_2026[p], atualizadoEm: agoraISO() } })),
          { col: "funcionarios", id: mat, data: { matricula: mat, nome, perfis: ["rh"], nivel: "gestor", naBase: false, origem: "manual" } },
        ]);
        S.boot = false;
        await aoMudarSessao({ uid });
      } catch (er) { S.boot = false; $("#u-msg").textContent = erroAmigavel(er); }
    });
  };
}
async function entrarNoApp() {
  await recarregarCiclo();
  renderShell();
}
async function aoMudarSessao(u) {
  if (S.boot) return;
  Object.keys(C).forEach((k) => delete C[k]);
  if (!u) {
    S.me = null;
    const cfg = await DB.get("config", "geral").catch(() => null);
    return cfg ? telaLogin() : telaSetup();
  }
  const me = await DB.get("usuarios", u.uid).catch(() => null);
  if (!me) { await AUTH.logout(); return telaLogin("Este acesso foi desativado ou reiniciado. Procure o RH."); }
  S.me = { ...me, uid: u.uid };
  if (me.trocarSenha) return telaTrocaSenha(false);
  await entrarNoApp();
}

    AUTH.onChange((u) => aoMudarSessao(u).catch((e) => { console.error(e); telaLogin(erroAmigavel(e)); }));

<script>
/* js/rh.js */
/* ============================================================
   TELAS DO RH — ciclo, base, ocorrências, elegibilidade,
   avaliadores, questionários, acessos e acompanhamento

"use strict";

/* ================= CICLO ================= */
function datasDoCiclo(sem, ano) {
  ano = +ano;
  return sem === "06"
    ? { id: `${ano}-06`, rotulo: `Jun/${ano}`, corte: `${ano - 1}-12-31`, periodoIni: `${ano}-01-01`, periodoFim: `${ano}-06-30` }
    : { id: `${ano}-12`, rotulo: `Dez/${ano}`, corte: `${ano}-06-30`, periodoIni: `${ano}-07-01`, periodoFim: `${ano}-12-31` };
}

PAGES.ciclos = async (el) => {
  const c = S.ciclo;
  const todos = (await DB.list("ciclos")).sort((a, b) => b.id.localeCompare(a.id));
  let html = `<div class="page">${cabecalho("Gestão do ciclo", "Ciclo de avaliação", "Abra o ciclo semestral e avance as etapas. Cada etapa libera as telas correspondentes para avaliadores, N2 e Diretoria.")}`;

  if (c) {
    const funcs = await carregarFuncs(); await carregarDeptos();
    const eleg = await DB.get("elegibilidade", c.id);
    const avs = c.etapa !== "preparacao" ? await DB.list("avaliacoes", [["ciclo", "==", c.id]]) : [];
    const nBase = Object.values(funcs).filter((f) => f.naBase !== false).length;
    const nEleg = eleg && eleg.congelada ? Object.values(eleg.lista).filter((x) => x.elegivel).length : 0;
    const semAval = eleg && eleg.congelada ? Object.keys(eleg.lista).filter((m) => eleg.lista[m].elegivel && funcs[m] && !avaliadorDireto(funcs[m])).length : null;
    const enviadas = avs.filter((a) => a.status === "enviada").length;
    const ck = (ok, t, link) => `<li style="margin:6px 0">${ok ? '<span class="pill p-ok">ok</span>' : '<span class="pill p-warn">pendente</span>'} ${t} ${link ? `<button class="btn-link" onclick="ir('${link}')">abrir</button>` : ""}</li>`;
    html += `<div class="panel"><h2>Ciclo ${esc(c.rotulo)}</h2>
      <p class="desc">Admissão até <b>${fmtData(c.corte)}</b> · Ocorrências contadas de <b>${fmtData(c.periodoIni)}</b> a <b>${fmtData(c.periodoFim)}</b></p>
      ${stepperHTML(c.etapa)}`;
    if (c.etapa === "preparacao") {
      html += `<ul style="list-style:none;padding:0;margin:16px 0 0;font-size:13.5px">
        ${ck(nBase > 0, `Base de funcionários importada (${nBase} pessoas)`, "funcionarios")}

        ${ck(semAval === 0, semAval == null ? "Avaliadores definidos para todos os elegíveis" : semAval ? `${semAval} elegíveis ainda sem avaliador direto` : "Todos os elegíveis têm avaliador direto", "avaliadores")}
      </ul>
<div class="form-grid" style="margin-top:16px;max-width:520px"><div class="fld"><label>Prazo para respostas</label><input type="date" id="c-prazo" value="${c.prazo || ""}"></div><div class="fld"><label>&nbsp;</label><span class="hint">${esc(prazoTxt(c)) || "Aparece para os avaliadores e na mensagem de cobrança."}</span></div></div>
      <div class="btn-row"><button class="btn btn-primary" id="bt-gerar" ${eleg && eleg.congelada && semAval === 0 ? "" : "disabled"}>Gerar avaliações e abrir respostas</button></div>
      <p class="hint">O sistema cria uma avaliação para cada par avaliador × avaliado: líder direto para todos, liderados para a liderança e todos os outros gestores para os gestores.</p>`;
    } else if (c.etapa === "avaliacao") {
      html += `<div class="kpis" style="margin-top:16px">${kpi("Avaliações enviadas", `${enviadas}/${avs.length}`, `${pct(enviadas, avs.length)}% de adesão`, pct(enviadas, avs.length))}</div><div class="form-grid" style="margin-top:16px;max-width:520px"><div class="fld"><label>Prazo para respostas</label><input type="date" id="c-prazo" value="${c.prazo || ""}"></div><div class="fld"><label>&nbsp;</label><span class="hint">${esc(prazoTxt(c)) || "Aparece para os avaliadores e na mensagem de cobrança."}</span></div></div>

      <div class="btn-row"><button class="btn btn-ghost" onclick="ir('calibracao')">Abrir calibração</button>

    } else if (c.etapa === "comite") {
      html += `<div class="btn-row"><button class="btn btn-ghost" onclick="ir('comite')">Abrir Comitê</button><button class="btn btn-ghost" onclick="ir('cartas')">Cartas</button>
      <button class="btn btn-primary" id="bt-avancar">Encerrar ciclo</button></div>`;

      html += `<p class="note">Ciclo encerrado. Resultados, Comitê e cartas continuam disponíveis para consulta.</p>`;

    if (c.etapa !== "preparacao") html += `<div class="btn-row"><button class="btn btn-mini btn-ghost" id="bt-voltar">Voltar uma etapa</button></div>`;
    html += `</div>`;
  } else {
    html += `<div class="note">Nenhum ciclo aberto. Crie o ciclo abaixo para começar.</div>`;
  }

  if (!c || c.etapa === "encerrado") {
    const ano = new Date().getFullYear(), mes = new Date().getMonth() + 1;
    html += `<div class="panel"><h2>Abrir novo ciclo</h2><p class="desc">As datas são preenchidas pela regra: junho exige admissão até 31/12 do ano anterior; dezembro, até 30/06.</p>
      <div class="form-grid">

/* -------- geração das avaliações (avaliador × avaliado) -------- */
async function gerarAvaliacoes() {
  const c = S.ciclo;
  const funcs = await carregarFuncs(true); await carregarDeptos(true); const quest = await carregarQuest(true);
  const eleg = await DB.get("elegibilidade", c.id);
  if (!eleg || !eleg.congelada) { toast("Congele a lista de elegíveis antes.", true); return null; }
  const elegiveis = Object.keys(eleg.lista).filter((m) => eleg.lista[m].elegivel && funcs[m]);
  const ativos = Object.values(funcs).filter((f) => ativoNaBase(f) && f.nivel !== "diretoria");
  const problemas = []; const pares = {};
  const add = (avaliado, avaliador, papel) => {
    if (!avaliador || avaliador === avaliado.matricula) return;
    const id = `${c.id}_${avaliado.matricula}_${avaliador}`;
    if (pares[id]) return;
    const pub = NIVEIS[avaliado.nivel].publico;
    pares[id] = { ciclo: c.id, avaliado: avaliado.matricula, avaliadoNome: avaliado.nome, avaliadoCargo: avaliado.cargo || "", avaliadoDepto: avaliado.depto || "", avaliadoNivel: avaliado.nivel,
      avaliador, avaliadorNome: funcs[avaliador] ? funcs[avaliador].nome : avaliador, papel, publico: pub, status: "pendente", notas: {}, comentario: "" };
  };
  elegiveis.forEach((m) => {
    const f = funcs[m];
    if (!NIVEIS[f.nivel] || !NIVEIS[f.nivel].publico) return;
    const dir = avaliadorDireto(f);
    if (!dir) { problemas.push(`${f.matricula} ${titulo(f.nome)} — sem avaliador direto`); return; }
    add(f, dir, "lider");
    if (f.nivel === "lideranca") ativos.filter((x) => avaliadorDireto(x) === m).forEach((x) => add(f, x.matricula, "liderado"));
    if (f.nivel === "gestor") ativos.filter((x) => x.nivel === "gestor").forEach((x) => add(f, x.matricula, "par"));
  });
  if (problemas.length) {
    modal(`<h3>Avaliações não geradas</h3><p>Corrija os itens abaixo em <b>Avaliadores</b> e tente de novo:</p><div class="table-wrap" style="max-height:300px"><table><tbody>${problemas.map((p) => `<tr><td>${esc(p)}</td></tr>`).join("")}</tbody></table></div><div class="btn-row"><button class="btn btn-primary" onclick="fecharModal();ir('avaliadores')">Ir para Avaliadores</button></div>`);
    return null;
  }
  const existentes = await DB.list("avaliacoes", [["ciclo", "==", c.id]]);
  const exIds = new Set(existentes.map((a) => a.id));
  const ops = [];
  Object.entries(pares).forEach(([id, d]) => { if (!exIds.has(id)) ops.push({ col: "avaliacoes", id, data: { ...d, criadaEm: agoraISO() } }); });
  let removidas = 0;
  existentes.forEach((a) => { if (!pares[a.id] && a.status === "pendente") { ops.push({ op: "delete", col: "avaliacoes", id: a.id }); removidas++; } });
  /* fotografia do questionário usado no cálculo (eixo de cada competência) */
  const snap = {}; Object.keys(PUBLICOS).forEach((p) => (snap[p] = quest[p].map((q) => ({ id: q.id, nome: q.nome, eixo: q.eixo }))));
  ops.push({ op: "update", col: "ciclos", id: c.id, data: { questionarios: snap } });
  await DB.batch(ops);
  await auditar("gerar_avaliacoes", `${c.id}: +${ops.length - 1 - removidas} -${removidas}`);
  await recarregarCiclo();
  return { criadas: ops.length - 1 - removidas, removidas };
}

/* -------- cálculo de resultados -------- */
async function calcularResultados() {
  const c = (await DB.get("ciclos", S.ciclo.id));
  const funcs = await carregarFuncs(true); const deptos = await carregarDeptos(true);
  const eleg = await DB.get("elegibilidade", c.id);
  const avs = (await DB.list("avaliacoes", [["ciclo", "==", c.id]]));
  const exist = {}; (await DB.list("resultados", [["ciclo", "==", c.id]])).forEach((r) => (exist[r.id] = r));
  const quest = c.questionarios || (await carregarQuest());
  const ant = await fonteAnterior(c.id);
  const porAvaliado = {};
  avs.forEach((a) => (porAvaliado[a.avaliado] = porAvaliado[a.avaliado] || []).push(a));
  const ops = [];
  Object.keys(eleg.lista).filter((m) => eleg.lista[m].elegivel).forEach((m) => {
    const f = funcs[m] || eleg.lista[m];
    const lista = porAvaliado[m] || [];
    const env = lista.filter((a) => a.status === "enviada");
    const pub = NIVEIS[f.nivel] ? NIVEIS[f.nivel].publico : "ci";
    const comps = quest[pub] || [];
    const notasComp = {}; const tec = [], comp = [], todas = []; const papel = { lider: [], liderado: [], par: [] };
    comps.forEach((q) => {
      const vs = env.map((a) => a.notas && a.notas[q.id]).filter((v) => typeof v === "number");
      if (vs.length) notasComp[q.id] = round2(avg(vs));
      env.forEach((a) => { const v = a.notas && a.notas[q.id]; if (typeof v !== "number") return; (q.eixo === "tec" ? tec : comp).push(v); todas.push(v); (papel[a.papel] || []).push(v); });
    });
    const nLid = env.filter((a) => a.papel === "liderado").length, nPar = env.filter((a) => a.papel === "par").length;
    const evidencias = [];
    env.forEach((a) => {
      if (a.papel === "liderado" && nLid < MIN_ANON) return;
      Object.entries(a.obs || {}).forEach(([cid, t]) => { if (t) evidencias.push({ comp: (comps.find((q) => q.id === cid) || {}).nome || cid, nota: a.notas?.[cid] ?? null, papel: a.papel, texto: t }); });
      if (a.comentario) evidencias.push({ comp: "Comentário geral", nota: null, papel: a.papel, texto: a.comentario });
    });
    const mT = tec.length ? round2(avg(tec)) : null, mC = comp.length ? round2(avg(comp)) : null, mG = todas.length ? round2(avg(todas)) : null;
    const fT = faixa(mT), fC = faixa(mC);
    const boxCalc = fT && fC ? BOX[fT][fC] : null;
    const id = `${c.id}_${m}`; const old = exist[id];
    const d = (deptos[f.depto] || {});
    const data = {
      ciclo: c.id, matricula: m, nome: f.nome, cargo: f.cargo || "", depto: f.depto || "", nivel: f.nivel, publico: pub, faixaSal: f.faixa || "", admissao: f.admissao || "",
      n2: d.n2 || "", n2Nome: d.n2 && funcs[d.n2] ? funcs[d.n2].nome : "",
      notasComp, mediaTec: mT, mediaComp: mC, mediaGeral: mG, faixaTec: fT, faixaComp: fC, faixaGeral: faixa(mG), boxCalc,
      mediaPorPapel: { lider: papel.lider.length ? round2(avg(papel.lider)) : null, liderados: nLid >= MIN_ANON ? round2(avg(papel.liderado)) : null, pares: nPar >= MIN_ANON ? round2(avg(papel.par)) : null },
      ocultos: { liderados: nLid > 0 && nLid < MIN_ANON, pares: nPar > 0 && nPar < MIN_ANON },
      evidencias, dataCargo: f.dataCargo || null, ultimoReajuste: f.ultimoReajuste || null,
      anterior: ant ? ant.achar(m, f.nome) : null,
      nAval: { enviadas: env.length, total: lista.length, liderados: env.filter((a) => a.papel === "liderado").length, pares: env.filter((a) => a.papel === "par").length },
      calculadoEm: agoraISO(),
    };
    if (!old || !old.boxCal || old.boxCal === old.boxCalc) data.boxCal = boxCalc;
    if (!old) Object.assign(data, { justCal: "", recMerito: "", justMerito: "", validadoN2: false, decisao: "", obsComite: "", combinados: "" });
    ops.push({ col: "resultados", id, data, merge: true });
  });
  await DB.batch(ops);
  await auditar("calcular_resultados", `${c.id}: ${ops.length}`);
  return ops.length;
}

function lerPlanilhaFolha(buf) {
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
  const hi = rows.findIndex((r) => r.some((x) => norm(x) === "CHAPA" || norm(x) === "MATRICULA") && r.some((x) => norm(x) === "NOME"));
  if (hi < 0) throw new Error("Não encontrei o cabeçalho (colunas Chapa e Nome) na planilha.");
  const H = rows[hi].map(norm);
  const col = (...nomes) => H.findIndex((h) => nomes.some((n) => h.startsWith(n)));
  const ix = { chapa: col("CHAPA", "MATRICULA"), nome: col("NOME"), filial: col("FILIAL"), cargo: col("CARGO"), faixa: col("FAIXA"), depto: col("DEPTO", "DEPARTAMENTO", "SETOR"), status: col("STATUS", "SITUACAO"), cpf: col("CPF"), escala: col("ESCALA", "TURNO", "HORARIO"), adm: col("DT. ADMISSAO", "DT ADMISSAO", "ADMISSAO", "DATA ADMISSAO", "DATA DE ADMISSAO") };
  const out = [];
  rows.slice(hi + 1).forEach((r) => {
    const raw = String(r[ix.chapa] ?? "").trim();
    if (!/^\d+$/.test(raw)) return; // cabeçalhos repetidos, totais e linhas vazias
    const g = (k) => (ix[k] >= 0 ? String(r[ix[k]] ?? "").trim() : "");
    const x = { matricula: padMat(raw), nome: g("nome").toUpperCase(), filial: g("filial"), cargo: g("cargo").toUpperCase(), faixa: g("faixa"), depto: g("depto").toUpperCase(), status: g("status") || "Ativo", admissao: ix.adm >= 0 ? parseData(r[ix.adm]) : null };
    const cpf = padCPF(g("cpf")); if (cpf) x.cpf = cpf; // vazio não apaga o CPF já cadastrado
    if (g("escala")) x.escala = g("escala").toUpperCase();
    out.push(x);
  });
  return out;
}

/* ================= ELEGIBILIDADE ================= */
function calcularElegibilidade(funcs, ocs, c, ajustes) {
  const porMat = {}; ocs.forEach((o) => (porMat[o.matricula] = porMat[o.matricula] || []).push(o));
  const lista = {};
  Object.values(funcs).filter((f) => f.naBase !== false).forEach((f) => {
    const mot = [];
    if (f.nivel === "diretoria") mot.push("Diretoria — fora da avaliação");
    if (!f.admissao) mot.push("Sem data de admissão");
    else if (f.admissao > c.corte) mot.push(`Admitido em ${fmtData(f.admissao)} (após ${fmtData(c.corte)})`);
    if (!STATUS_OK.includes(norm(f.status))) mot.push(`Status: ${f.status}`);
    (porMat[f.matricula] || []).filter((o) => ocorrenciaNoPeriodo(o, c.periodoIni, c.periodoFim)).forEach((o) =>
      mot.push(o.tipo === "afastamento" ? `Afastamento a partir de ${fmtData(o.data)}` : `${TIPOS_OC[o.tipo]} em ${fmtData(o.data)}`));
    let elegivel = !mot.length; let ajuste = null;
    const aj = ajustes && ajustes[f.matricula];
    if (aj && f.nivel !== "diretoria") { elegivel = aj.elegivel; ajuste = aj.motivo; }
    lista[f.matricula] = { elegivel, motivos: mot, ajuste, nome: f.nome, cargo: f.cargo || "", depto: f.depto || "", nivel: f.nivel, admissao: f.admissao || "" };
  });
  return lista;
}

/* planilha simples: Chapa do funcionário + Chapa do líder */
function lerPlanilhaLider(buf, funcs) {
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false });
  const ehLider = (h) => /LIDER|GESTOR|AVALIADOR/.test(h);
  const hi = rows.findIndex((r) => { const H = r.map(norm); return H.some((h) => /^(CHAPA|MATRICULA)/.test(h) && !ehLider(h)) && H.some(ehLider); });
  if (hi < 0) throw new Error("Não encontrei as colunas Chapa e Chapa do líder. Use o modelo baixado nesta tela.");
  const H = rows[hi].map(norm);
  const iF = H.findIndex((h) => /^(CHAPA|MATRICULA)/.test(h) && !ehLider(h));
  const iL = [H.findIndex((h) => ehLider(h) && /CHAPA|MATRICULA/.test(h)), H.findIndex(ehLider)].find((i) => i >= 0);
  const res = { linhas: 0, iguais: 0, mudancas: [], erros: [] }; const vistos = new Set();
  rows.slice(hi + 1).forEach((r, k) => {
    const rf = soDig(r[iF]); if (!rf) return;
    res.linhas++;
    const mat = padMat(rf), f = funcs[mat], lin = `Linha ${hi + k + 2}`;
    if (!f) return res.erros.push(`${lin}: chapa ${mat} não está na base`);
    if (vistos.has(mat)) return res.erros.push(`${lin}: chapa ${mat} repetida (vale a primeira)`);
    vistos.add(mat);
    const rl = soDig(String(r[iL] ?? "").split(/[—–]/)[0]);
    const lider = rl ? padMat(rl) : "";
    if (lider && !funcs[lider]) return res.erros.push(`${lin}: líder ${lider} de ${titulo(f.nome)} não está na base`);
    if (lider && funcs[lider].naBase === false) return res.erros.push(`${lin}: líder ${lider} (${titulo(funcs[lider].nome)}) está fora da base`);
    if (lider === mat) return res.erros.push(`${lin}: ${titulo(f.nome)} não pode ser líder de si mesmo`);
    /* líder igual à regra do departamento: não precisa ficar gravado por pessoa */
    const regra = avaliadorDireto({ ...f, avaliadorDireto: null }) || "";
    const atual = f.avaliadorDireto || "";
    const para = lider === regra ? "" : lider;
    if (atual === para) { res.iguais++; return; }
    res.mudancas.push({ mat, de: atual || regra, para: para || regra, gravar: para });
  });
  return res;
}

      const ops = [{ op: "delete", col: "usuarios", id: l.uid }, { op: "delete", col: "logins", id: m }];
      if (l.cpf) ops.push({ op: "delete", col: "logins", id: "cpf_" + l.cpf });
      await DB.batch(ops); await auditar("remover_acesso", m); ir("acessos");
    }));
  };
  ["#ac-busca", "#ac-f", "#ac-av", "#ac-t"].forEach((s) => ($(s).oninput = render)); render();
  const mostrarSenha = (f, s) => {
    const cpf = s === null;
    const m = modal(`<h3>${cpf ? "Acesso por CPF" : "Senha inicial"}</h3><p style="margin-top:0">${esc(titulo(f.nome))} · matrícula <b>${f.matricula}</b></p>
      ${cpf ? `<p>Usuário e senha: o próprio CPF, só números (${esc(fmtCPF(f.cpf))}). A senha é fixa.</p>`
        : `<div style="font-family:var(--display);font-stretch:75%;font-weight:900;font-size:44px;color:var(--verde);letter-spacing:.06em">${esc(s)}</div><p class="hint">Entregue à pessoa. No primeiro acesso ela criará a própria senha.</p>`}
      <div class="btn-row"><button class="btn btn-primary" id="ms-ok">Fechar</button></div>`);
    $("#ms-ok", m).onclick = () => { fecharModal(); ir("acessos"); };
  };
  $("#bt-baixar").onclick = () => baixarXLSX(S.senhasGeradas.map((x) => ({ Matrícula: x.matricula, Nome: x.nome, Cargo: x.cargo, Departamento: x.depto, "Senha inicial": x.senha, "Gerada em": x.em })), "Senhas iniciais", `senhas_iniciais_${hojeISO()}.xlsx`);
  $("#bt-ger").onclick = (ev) => comBotao(ev.currentTarget, async () => {
    const prog = $("#ger-prog"); let ok = 0, okCPF = 0; const fila = [...pend, ...ajustar];
    for (const x of fila) {
      try { const s = await criarAcesso(x.f, logins[x.f.matricula], lideres); ok++; if (s === null) okCPF++; prog.textContent = `${ok} de ${fila.length} criados…`; }
      catch (e) {
        if (/too-many|quota/.test(e.code || e.message)) { prog.innerHTML = `<b>Limite do Firebase atingido após ${ok} contas.</b> Baixe as senhas geradas e continue mais tarde.`; break; }
        throw e;
      }
    }
    toast(`${ok} acessos criados (${okCPF} por CPF).${ok > okCPF ? " Baixe a planilha de senhas." : ""}`);
    await PAGES.acessos(el);

};
/* quem é líder direto de alguém da base ativa */
function lideresDiretos(funcs) {
  const s = new Set();
  Object.values(funcs).forEach((f) => { if (ativoNaBase(f) && f.nivel !== "diretoria") { const l = avaliadorDireto(f); if (l) s.add(l); } });
  return s;
}
/* CPF: operacional, sem perfil e que não lidera ninguém (só avalia o próprio líder) */
function tipoAcessoEsperado(f, lideres) {
  return f.nivel === "operacional" && !(f.perfis || []).length && !lideres.has(f.matricula) && cpfValido(f.cpf) ? "cpf" : "matricula";
}
/* cria (ou recria) o acesso; devolve a senha inicial, ou null quando o acesso é por CPF */
async function criarAcesso(f, loginAtual, lideres) {
  const porCPF = tipoAcessoEsperado(f, lideres || lideresDiretos(C.func || {})) === "cpf";
  const senha = porCPF ? padCPF(f.cpf) : senhaAleatoria();
  const email = (v) => (porCPF ? emailCPF(f.matricula, v) : emailDe(f.matricula, v));
  let versao = loginAtual ? (loginAtual.versao || 0) + 1 : 0;
  let uid = null;
  for (let t = 0; t < 5 && !uid; t++) {
    try { uid = await AUTH.createUser(email(versao), senha); }
    catch (e) { if (/email-already-in-use/.test(e.code || e.message)) versao++; else throw e; }
  }
  if (!uid) throw new Error("Não foi possível criar o acesso.");
  const tipo = porCPF ? "cpf" : "matricula";
  const ops = [
    { col: "usuarios", id: uid, data: { matricula: f.matricula, nome: f.nome, perfis: f.perfis || [], trocarSenha: !porCPF, tipoAcesso: tipo, versao, criadoEm: agoraISO() } },
    { col: "logins", id: f.matricula, data: { email: email(versao), uid, versao, tipo, cpf: porCPF ? senha : null } },
  ];
  if (porCPF) ops.push({ col: "logins", id: "cpf_" + senha, data: { email: email(versao), uid, matricula: f.matricula } });
  if (loginAtual && loginAtual.cpf && (!porCPF || loginAtual.cpf !== senha)) ops.push({ op: "delete", col: "logins", id: "cpf_" + loginAtual.cpf });
  if (loginAtual && loginAtual.uid && loginAtual.uid !== uid) ops.push({ op: "delete", col: "usuarios", id: loginAtual.uid });
  await DB.batch(ops);
  await auditar(loginAtual ? "reiniciar_senha" : "criar_acesso", `${f.matricula} (${tipo})`);
  if (porCPF) return null;
  S.senhasGeradas.push({ matricula: f.matricula, nome: f.nome, cargo: f.cargo || "", depto: f.depto || "", senha, em: new Date().toLocaleString("pt-BR") });
  return senha;
}

<script>
/* js/salarial.js */
/* ============================================================
   TABELA SALARIAL e PROJEÇÃO DE MÉRITO
   A projeção usa o valor da tabela na faixa atual da pessoa e o
   valor da faixa seguinte (ou a faixa escolhida pelo N2).
   ============================================================ */
"use strict";

const FAIXAS_SAL = ["A", "B", "C", "D", "E", "F"];
const brl = (v) => (v == null || isNaN(v) ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }));
const pctTxt = (v) => (v == null || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + v.toFixed(1).replace(".", ",") + "%");

async function carregarTabela(forcar) {
  if (C.tabela === undefined || forcar) C.tabela = await DB.get("tabela", "atual").catch(() => null);
  return C.tabela;
}

function lerTabelaSalarial(buf) {
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
  const hi = rows.findIndex((r) => r.some((x) => norm(x) === "CARGO") && r.some((x) => norm(x) === "A") && r.some((x) => norm(x) === "B"));
  if (hi < 0) throw new Error("Não encontrei o cabeçalho (colunas CARGO e faixas A a F) na planilha.");
  const H = rows[hi].map(norm);
  const ix = (n) => H.indexOf(n);
  const iF = {}; FAIXAS_SAL.forEach((f) => (iF[f] = ix(f)));
  const num = (v) => { if (v === "" || v == null) return null; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[R$\s.]/g, "").replace(",", ".")); return isNaN(n) ? null : round2(n); };
  const linhas = [];
  rows.slice(hi + 1).forEach((r, k) => {
    const cargo = String(r[ix("CARGO")] ?? "").trim();
    if (!cargo) return;
    const valores = {}; FAIXAS_SAL.forEach((f) => (valores[f] = iF[f] >= 0 ? num(r[iF[f]]) : null));
    if (FAIXAS_SAL.every((f) => valores[f] == null)) return;
    const g = (n) => (ix(n) >= 0 ? String(r[ix(n)] ?? "").trim() : "");
    linhas.push({ id: g("ID") || "l" + k, cargo: cargo.toUpperCase(), depto: g("DEPARTAMENTO").toUpperCase(), filial: g("FILIAL"), grupo: g("TABELA SALARIAL"), area: g("AREA"),
      valores, efetivoCargo: g("CARGO EFETIVO").toUpperCase(), efetivoFaixa: g("FAIXA EFETIVA").toUpperCase(), obs: g("OBS. EFETIVA") });
  });
  if (!linhas.length) throw new Error("Nenhum cargo com valores encontrado na planilha.");
  return linhas;
}

/* cargo + departamento; se não houver, o primeiro cargo com o mesmo nome */
function acharLinha(tab, cargo, depto) {
  if (!tab) return null;
  const c = norm(cargo), d = norm(depto);
  return tab.linhas.find((x) => norm(x.cargo) === c && norm(x.depto) === d) || tab.linhas.find((x) => norm(x.cargo) === c) || null;
}

/* projeção do mérito para um resultado (r.cargo, r.depto, r.faixaSal) */
function projetar(r, faixaDestino) {
  const tab = C.tabela;
  if (!tab) return { erro: "Tabela salarial não importada" };
  const l = acharLinha(tab, r.cargo, r.depto);
  if (!l) return { erro: "Cargo não está na tabela salarial" };
  const fa = String(r.faixaSal || "").trim().toUpperCase();
  if (!FAIXAS_SAL.includes(fa)) return { erro: "Sem faixa atual no cadastro" };
  const vAtual = l.valores[fa];
  if (vAtual == null) return { erro: `Faixa ${fa} sem valor na tabela` };
  let opcoes = FAIXAS_SAL.slice(FAIXAS_SAL.indexOf(fa) + 1).filter((f) => l.valores[f] != null).map((f) => ({ cargo: l.cargo, faixa: f, valor: l.valores[f] }));
  if (!opcoes.length && l.efetivoCargo) {
    const le = acharLinha(tab, l.efetivoCargo, r.depto); const ff = l.efetivoFaixa || "A";
    if (le && le.valores[ff] != null) opcoes = [{ cargo: le.cargo, faixa: ff, valor: le.valores[ff], efetivacao: true }];
  }
  if (!opcoes.length) return { erro: fa === "F" ? "Já está na faixa F (topo)" : "Sem faixa seguinte na tabela", faixaAtual: fa, valorAtual: vAtual };
  const d = opcoes.find((o) => o.faixa === faixaDestino) || opcoes[0];
  return { cargoAtual: l.cargo, faixaAtual: fa, valorAtual: vAtual, cargoDestino: d.cargo, faixaDestino: d.faixa, valorDestino: d.valor,
    dif: round2(d.valor - vAtual), pct: round2((d.valor / vAtual - 1) * 100), efetivacao: !!d.efetivacao, opcoes };
}
const projSalvar = (p) => (p && !p.erro ? { cargoAtual: p.cargoAtual, faixaAtual: p.faixaAtual, valorAtual: p.valorAtual, cargoDestino: p.cargoDestino, faixaDestino: p.faixaDestino, valorDestino: p.valorDestino, dif: p.dif, pct: p.pct, efetivacao: p.efetivacao, em: agoraISO() } : null);
function projHTML(p) {
  if (!p) return "—";
  if (p.erro) return `<span class="pill p-warn">${esc(p.erro)}</span>`;
  return `<b>${p.faixaAtual} → ${p.efetivacao ? esc(titulo(p.cargoDestino)) + " " : ""}${p.faixaDestino}</b> <span class="pill p-ok">${pctTxt(p.pct)}</span>
    <span class="sub">${brl(p.valorAtual)} → ${brl(p.valorDestino)} (${brl(p.dif)}/mês)</span>`;
}
function projExport(r) {
  const p = r.recMerito === "Recomenda" ? projetar(r, r.faixaProposta) : null;
  return { "Faixa atual (tabela)": p && !p.erro ? p.faixaAtual : r.faixaSal || "", "Valor faixa atual": p && !p.erro ? p.valorAtual : "", "Cargo proposto": p && !p.erro ? p.cargoDestino : "",
    "Faixa proposta": p && !p.erro ? p.faixaDestino : "", "Valor faixa proposta": p && !p.erro ? p.valorDestino : "", "Ajuste mensal estimado": p && !p.erro ? p.dif : "", "Ajuste %": p && !p.erro ? p.pct : "", "Obs. projeção": p && p.erro ? p.erro : "" };
}

/* ================= TELA: TABELA SALARIAL ================= */
PAGES.tabela = async (el) => {
  const tab = await carregarTabela(true);
  const funcs = await carregarFuncs();
  const base = Object.values(funcs).filter((f) => f.naBase !== false && f.nivel !== "diretoria");
  const semCargo = tab ? base.filter((f) => !acharLinha(tab, f.cargo, f.depto)) : [];
  const semFaixa = base.filter((f) => !FAIXAS_SAL.includes(String(f.faixa || "").toUpperCase()));
  el.innerHTML = `<div class="page">${cabecalho("Remuneração", "Tabela salarial", "Valores por cargo e faixa (A a F). A calibração usa esta tabela para projetar o ajuste por mérito: valor da faixa atual da pessoa → valor da faixa seguinte. Importe de novo sempre que a tabela for atualizada.")}
    <div class="panel"><h2>Importar tabela</h2><p class="desc">${tab ? `Tabela atual: <b>${esc(tab.arquivo || "")}</b>, importada em ${fmtData(tab.importadoEm)} por ${esc(nomeDe(tab.por))} · ${tab.linhas.length} cargos.` : "Nenhuma tabela importada ainda."} A nova importação substitui a anterior; projeções já salvas são recalculadas ao abrir a calibração.</p>
      <input type="file" id="ts-imp" accept=".xlsx,.xls"><div id="ts-res"></div></div>
    ${tab ? `<div class="kpis">${kpi("Cargos na tabela", tab.linhas.length)}${kpi("Funcionários com cargo encontrado", `${base.length - semCargo.length}/${base.length}`, "", pct(base.length - semCargo.length, base.length))}${kpi("Sem faixa no cadastro", semFaixa.length, "Sem projeção de mérito")}</div>
    ${semCargo.length ? `<div class="panel"><h2>Cargos da base fora da tabela</h2><p class="desc">Essas pessoas não terão projeção. Inclua o cargo na tabela ou corrija o cargo na folha.</p><div class="table-wrap" style="max-height:280px"><table><thead><tr><th>Cargo</th><th>Departamento</th><th class="num">Pessoas</th></tr></thead><tbody>
      ${Object.entries(semCargo.reduce((a, f) => { const k = f.cargo + "|" + f.depto; a[k] = (a[k] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<tr><td>${esc(k.split("|")[0])}</td><td>${esc(k.split("|")[1])}</td><td class="num">${n}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    <div class="filter-bar"><div class="fld grow"><label>Buscar</label><input id="ts-busca" placeholder="Cargo ou departamento"></div></div>
    <div class="table-wrap"><table><thead><tr><th>Cargo</th><th>Departamento</th>${FAIXAS_SAL.map((f) => `<th class="num">${f}</th>`).join("")}<th>Efetivação</th></tr></thead><tbody id="ts-body"></tbody></table></div>` : ""}</div>`;
  if (tab) {
    const render = () => {
      const b = norm($("#ts-busca").value);
      $("#ts-body").innerHTML = tab.linhas.filter((l) => !b || norm(l.cargo + " " + l.depto).includes(b)).map((l) => `<tr><td><b>${esc(l.cargo)}</b><span class="sub">${esc(l.grupo || "")}</span></td><td>${esc(l.depto)}</td>
        ${FAIXAS_SAL.map((f) => `<td class="num">${l.valores[f] != null ? brl(l.valores[f]) : "—"}</td>`).join("")}<td>${l.efetivoCargo ? `${esc(titulo(l.efetivoCargo))} · ${esc(l.efetivoFaixa || "A")}` : ""}</td></tr>`).join("");
    };
    $("#ts-busca").oninput = render; render();
  }
  $("#ts-imp").onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const box = $("#ts-res");
    try {
      const linhas = lerTabelaSalarial(await file.arrayBuffer());
      box.innerHTML = `<div class="note"><b>${linhas.length}</b> cargos lidos em "${esc(file.name)}".</div><div class="btn-row"><button class="btn btn-primary" id="ts-ok">Substituir tabela</button><button class="btn btn-ghost" id="ts-x">Cancelar</button></div>`;
      $("#ts-x").onclick = () => { box.innerHTML = ""; e.target.value = ""; };
      $("#ts-ok").onclick = (ev) => comBotao(ev.currentTarget, async () => {

  };
};
